name: macOS Apple Silicon build
on:
  push:
    branches: [main]
    paths:
      - 'macos/**'
      - '.github/workflows/macos.yml'
      - 'src/MySystem.Rendering/**'
      - 'assets/3d-models/**'
      - 'assets/icons/**'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/MySystem.Rendering/package-lock.json
      - name: Inspect macOS toolchain
        run: |
          uname -m
          xcodebuild -version
          xcrun swiftc --version
      - name: Build and validate app bundle, ZIP and DMG
        run: bash macos/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: MySystem-macOS-arm64
          path: |
            artifacts/MySystem-macOS-arm64.zip
            artifacts/MySystem-macOS-arm64.dmg
            artifacts/SHA256SUMS-macOS.txt
          if-no-files-found: error
      - name: Release macOS preview
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v0.2.0-macos-build.${{ github.run_number }}"
          gh release create "$tag"             artifacts/MySystem-macOS-arm64.dmg             artifacts/MySystem-macOS-arm64.zip             artifacts/SHA256SUMS-macOS.txt             --target '${{ github.sha }}'             --title "My System 0.2.0 — Apple Silicon Preview"             --prerelease --notes-file macos/README.md
